name: Build MU Trading APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir android-project
          unzip -q MU_Trading_Customer_Android_Project.zip -d android-project

      - name: Find project directory
        id: project
        run: |
          PROJECT_DIR=$(dirname "$(find android-project -name settings.gradle -type f | head -1)")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Make app fullscreen
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          python3 - <<'PY'
          p="app/src/main/java/com/mutrading/customer/MainActivity.java"
          s=open(p).read()

          s=s.replace(
              'super.onCreate(savedInstanceState);',
              '''super.onCreate(savedInstanceState);

                  getWindow().setFlags(
                      android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );

                  getWindow().getDecorView().setSystemUiVisibility(
                      android.view.View.SYSTEM_UI_FLAG_FULLSCREEN |
                      android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                      android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                      android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                      android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );'''
          )

          open(p,"w").write(s)
          PY

      - name: Connect app to live Customer Shop
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          sed -i 's#file:///android_asset/index.html#https://bright-kringle-c65c5d.netlify.app#' app/src/main/java/com/mutrading/customer/MainActivity.java

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MU-Trading-APK-FULLSCREEN
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
